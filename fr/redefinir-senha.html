<title>Choisir un nouveau mot de passe — OAZE</title>
<meta name="description" content="Définissez un nouveau mot de passe pour votre compte OAZE.">
<link rel="canonical" href="https://oaze.site/fr/redefinir-senha">
<!-- idiomas: gerado por tools/gen-idiomas.js -->
<link rel="alternate" hreflang="pt-BR" href="https://oaze.site/redefinir-senha">
<link rel="alternate" hreflang="en" href="https://oaze.site/en/redefinir-senha">
<link rel="alternate" hreflang="fr" href="https://oaze.site/fr/redefinir-senha">
<link rel="alternate" hreflang="es" href="https://oaze.site/es/redefinir-senha">
<link rel="alternate" hreflang="x-default" href="https://oaze.site/redefinir-senha">

<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/img/oaze-48.png" sizes="48x48" type="image/png">

<body>

<div class="ceu" aria-hidden="true"></div>
<a class="pular" href="#conteudo">Aller au contenu</a>

<header class="topo">
  <div class="env">
    <a class="marca" href="/fr/" aria-label="OAZE, page d'accueil">
        <img src="/assets/img/oaze-mark.svg" alt="" width="28" height="28" decoding="async">
      OAZE
    </a>
  </div>
</header>

<main id="conteudo" class="secao">
  <div class="env">
    <div class="painel-conta">
      <h1>Choisir un nouveau mot de passe</h1>
      <p id="explica">Vérification du lien…</p>

      <p class="recado" id="recado" role="status" aria-live="polite" hidden></p>

      <form id="form-senha" novalidate hidden>
        <div class="campo">
          <label for="senha">Nouveau mot de passe</label>
          <input type="password" id="senha" name="senha" autocomplete="new-password"
                 required minlength="8" placeholder="Au moins 8 caractères"
                 aria-describedby="senha-dica senha-erro">
          <p class="dica" id="senha-dica">Au moins 8 caractères.</p>
          <p class="erro" id="senha-erro" hidden></p>
        </div>

        <div class="campo">
          <label for="senha2">Répétez le nouveau mot de passe</label>
          <input type="password" id="senha2" name="senha2" autocomplete="new-password"
                 required placeholder="Le même mot de passe" aria-describedby="senha2-erro">
          <p class="erro" id="senha2-erro" hidden></p>
        </div>

        <button class="btn btn-principal btn-largo btn-grande" type="submit" id="botao">Enregistrer et se connecter</button>
      </form>

      <p class="pe-do-painel" id="pe" hidden>
        <a href="/fr/recuperar-senha">Demander un nouveau lien</a>
      </p>
    </div>
  </div>
</main>

<script src="/assets/vendor/supabase.js"></script>
<script src="/assets/js/supabase-config.js"></script>
<script src="/assets/js/site-auth.js"></script>
<script>
(function () {
  'use strict';
  var A = window.SiteAuth;
  var recado = document.getElementById('recado');
  var explica = document.getElementById('explica');
  var form = document.getElementById('form-senha');
  var senha = document.getElementById('senha');
  var senha2 = document.getElementById('senha2');
  var botao = document.getElementById('botao');
  var pe = document.getElementById('pe');

  if (!A.cliente()) { explica.textContent = ''; A.semConfig(recado); return; }

  /* O link do e-mail chega com o token no fragmento da URL. O SDK
     troca isso por uma sessão de recuperação -- mas leva um instante,
     e o evento pode chegar depois deste script rodar. Por isso duas
     vias: escutar o evento E consultar direto. A que responder
     primeiro libera o formulário; um guarda impede o formulário de
     ser mostrado duas vezes. */
  var liberado = false;

  function liberar() {
    if (liberado) return;
    liberado = true;
    explica.textContent = 'Choisissez un mot de passe que vous n\'utilisez nulle part ailleurs.';
    form.hidden = false;
    senha.focus();
  }

  function recusar() {
    if (liberado) return;
    explica.textContent = '';
    A.diz(recado, 'Ce lien n\'est plus valable. Les liens de réinitialisation ne servent qu\'une fois et expirent au bout d\'une heure.', 'erro');
    pe.hidden = false;
  }

  A.cliente().auth.onAuthStateChange(function (evento, sessao) {
    if (evento === 'PASSWORD_RECOVERY' || (sessao && sessao.user)) liberar();
  });

  A.quemEsta().then(function (u) {
    if (u) liberar();
    /* Só recusa depois de dar tempo ao SDK de processar o fragmento.
       Recusar de imediato mostraria "link inválido" para todo mundo,
       inclusive para quem tem um link perfeitamente bom. */
    else setTimeout(function () { A.quemEsta().then(function (v) { v ? liberar() : recusar(); }); }, 1200);
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    A.diz(recado, '');
    A.erroNoCampo(senha, ''); A.erroNoCampo(senha2, '');

    if (senha.value.length < 8) {
      A.erroNoCampo(senha, 'Le mot de passe doit contenir au moins 8 caractères.');
      senha.focus(); return;
    }
    if (senha.value !== senha2.value) {
      A.erroNoCampo(senha2, 'Les deux mots de passe ne correspondent pas.');
      senha2.focus(); return;
    }

    A.ocupado(botao, true, 'Enregistrement…');
    try {
      var r = await A.trocarSenha(senha.value);
      if (r.error) throw r.error;
      A.diz(recado, 'Mot de passe modifié. Ouverture de votre tableau de bord…', 'ok');
      location.replace('/app');
    } catch (err) {
      A.ocupado(botao, false);
      A.diz(recado, A.frase(err), 'erro');
    }
  });
})();
</script>
<script src="/assets/js/cookies.js" defer></script>
