<script>
/* A língua, também antes da primeira pintura. Nesta ordem:
     1. a escolha feita em Configurações (oaze.idioma);
     2. ?lang= no endereço — o link das páginas em inglês, francês e
        espanhol para o app leva isso;
     3. a língua da última página do site que a pessoa leu;
     4. quem já usa o app (tem financas.v1) fica em português, como
        sempre foi: trocar a língua de alguém sem ele pedir não é
        detalhe; quem chega agora recebe a do navegador.
   Fora do português o corpo nasce escondido (data-traduzindo) até o
   dicionário traduzir a tela — e aparece de qualquer jeito em 3 s,
   para uma falha de rede nunca deixar o app em branco. */
(function () {
  var ok = { pt: 1, en: 1, fr: 1, es: 1 };
  var lang = null;
  try {
    var q = (location.search.match(/[?&]lang=([a-z]{2})\b/) || [])[1];
    lang = localStorage.getItem('oaze.idioma');
    if (!ok[lang]) lang = null;
    if (!lang && q && ok[q]) { lang = q; localStorage.setItem('oaze.idioma.site', q); }
    if (!lang) { var site = localStorage.getItem('oaze.idioma.site'); if (ok[site]) lang = site; }
    if (!lang && localStorage.getItem('financas.v1') === null) {
      var nav = String(navigator.language || 'pt').slice(0, 2).toLowerCase();
      lang = ok[nav] ? nav : 'en';
    }
  } catch (e) { /* sem armazenamento: português */ }
  lang = lang || 'pt';
  var raiz = document.documentElement;
  raiz.setAttribute('data-idioma', lang);
  raiz.setAttribute('lang', { pt: 'pt-BR', en: 'en', fr: 'fr', es: 'es' }[lang]);
  if (lang !== 'pt') {
    raiz.setAttribute('data-traduzindo', '');
    setTimeout(function () { raiz.removeAttribute('data-traduzindo'); }, 3000);
  }
})();
</script>
<style>html[data-traduzindo] body { visibility: hidden; }</style>
